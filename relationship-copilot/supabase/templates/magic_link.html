<!doctype html>
<html lang="en">
  <body style="margin: 0; background: #fbf7f3; color: #342d29; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">
    <div style="max-width: 560px; margin: 0 auto; padding: 48px 24px;">
      <p style="margin: 0 0 32px; font-size: 14px; font-weight: 650;">Relationship Copilot</p>
      <h1 style="margin: 0; font-size: 32px; line-height: 1.12;">Your private sign-in link</h1>
      <p style="margin: 20px 0 28px; color: #665b55; font-size: 16px; line-height: 1.6;">
        Use this secure link to return to your relationship memory. It expires shortly and can only be used once.
      </p>
      <p style="margin: 0 0 28px;">
        <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=email" style="display: inline-block; border-radius: 10px; background: #a64432; color: #ffffff; font-weight: 700; padding: 14px 20px; text-decoration: none;">
          Sign in to Relationship Copilot
        </a>
      </p>
      <p style="margin: 0; color: #665b55; font-size: 13px; line-height: 1.55;">
        If you did not request this link, you can safely ignore this email.
      </p>
    </div>
  </body>
</html>

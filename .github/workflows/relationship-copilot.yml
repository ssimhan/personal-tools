name: Relationship Copilot

on:
  pull_request:
    paths:
      - "relationship-copilot/**"
      - ".github/workflows/relationship-copilot.yml"
  push:
    branches: [main]
    paths:
      - "relationship-copilot/**"
      - ".github/workflows/relationship-copilot.yml"

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relationship-copilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: relationship-copilot/.nvmrc
          cache: npm
          cache-dependency-path: relationship-copilot/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=high

  database-and-browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relationship-copilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: relationship-copilot/.nvmrc
          cache: npm
          cache-dependency-path: relationship-copilot/package-lock.json
      - run: npm ci
      - name: Start local Supabase
        run: npx supabase start -x studio,imgproxy,storage-api,realtime,edge-runtime,logflare,vector,supavisor
      - run: npm run test:db
      - name: Export local test credentials
        run: |
          eval "$(npx supabase status -o env)"
          echo "NEXT_PUBLIC_APP_URL=http://127.0.0.1:3000" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SECRET_KEY" >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

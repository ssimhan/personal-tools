<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>CRM — Settings</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body class="options">
    <main>
      <h1><span class="dot"></span> CRM settings</h1>

      <label>
        <span>CRM base URL</span>
        <input id="baseUrl" type="url" disabled readonly />
        <small>Hard-coded. Edit <code>extension/popup.js</code> if this ever needs to change.</small>
      </label>

      <label>
        <span>API key</span>
        <input id="apiKey" type="password" placeholder="paste EXTENSION_API_KEY value" autocomplete="off" />
        <small>Generate with <code>openssl rand -hex 32</code>, set as <code>EXTENSION_API_KEY</code> in Vercel.</small>
      </label>

      <div class="row">
        <button id="save">Save</button>
        <button id="test" type="button">Test connection</button>
      </div>

      <p id="status" class="status"></p>
    </main>
    <script src="options.js"></script>
  </body>
</html>
